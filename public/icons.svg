<!-- 漢字：語 (SVG) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; }
    .stroke {
      fill: none;
      stroke: #000000;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <rect class="bg" width="100" height="100" />
  
  <!-- 言 (Parte izquierda / Radical "palabra") -->
  <g class="stroke">
    <!-- 点 -->
    <path d="M 23 18 L 28 23" />
    <!-- 横線 1 (長) -->
    <path d="M 12 30 L 40 30" />
    <!-- 横線 2 -->
    <path d="M 18 39 L 34 39" />
    <!-- 横線 3 -->
    <path d="M 18 47 L 34 47" />
    <!-- 口 -->
    <path d="M 16 57 L 16 78 L 36 78 L 36 57 Z" />
  </g>

  <!-- 吾 (Parte derecha) -->
  <g class="stroke">
    <!-- 五 (Arriba) -->
    <path d="M 50 20 L 82 20" />
    <path d="M 64 20 L 56 36 L 78 36" />
    <path d="M 72 36 L 72 49" />
    <path d="M 48 49 L 88 49" />
    <!-- 口 (Abajo) -->
    <path d="M 53 60 L 53 82 L 81 82 L 81 60 Z" />
  </g>
</svg>


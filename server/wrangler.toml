name = "tasktracker-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# D1 local = .wrangler/ (wrangler dev). Remota = dashboard / --remote.
[[d1_databases]]
binding = "DB"
database_name = "english"
database_id = "e023370e-570f-4306-9d5e-e86ade12ea36"

# Orígenes extra con permiso (CORS + CSRF), separados por coma.
# En prod agregá el dominio del front si vive aparte de la API.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
